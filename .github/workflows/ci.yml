name: CI

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite, fileinfo, gd, intl, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist
      - run: php tools/lint.php
      - run: vendor/bin/phpunit --testsuite unit
      - run: vendor/bin/phpunit --testsuite package

  native-mysql:
    name: Native MySQL ${{ matrix.db }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        db: ['mysql:8.4', 'mariadb:11.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: '1'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_DATABASE: wc_test
          MARIADB_DATABASE: wc_test
        ports: ['3306:3306']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite, fileinfo, gd, intl, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist
      - name: Wait for database (PDO poll)
        run: |
          php -r '
          $deadline = time() + 60;
          do {
              try {
                  new PDO("mysql:host=127.0.0.1;port=3306;dbname=wc_test", "root", "");
                  echo "db ready\n"; exit(0);
              } catch (Throwable $e) { usleep(500000); }
          } while (time() < $deadline);
          fwrite(STDERR, "db never became ready\n"); exit(1);'
      - name: Native schema + acceptance tests (MySQL/MariaDB)
        env:
          WC_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=wc_test'
          WC_TEST_MYSQL_USER: root
          WC_TEST_MYSQL_PASS: ''
        run: vendor/bin/phpunit --testsuite native

  core-only-boot:
    name: Core-only boot check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite, fileinfo
          coverage: none
      - name: Boot test — no packages present
        run: |
          php -l site/index.php
          php -l site/install.php
          php -l site/cron.php
          php tools/lint.php
      - name: Assert industry/addon dirs are empty by default
        run: |
          test -z "$(find site/modules/industries -mindepth 1 -maxdepth 1 -type d)"
          test -z "$(find site/modules/addons -mindepth 1 -maxdepth 1 -type d)"

  artifacts:
    name: Release artifacts build + contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite, fileinfo, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Build all release artifacts
        run: php tools/build-packages.php /tmp/dist
      - name: Artifact contract assertions
        run: |
          php -r '
          require "tests/bootstrap.php";
          // COMPLETE-UPLOAD: deployable members at root, prod vendor only.
          $z = new ZipArchive();
          $z->open(glob("/tmp/dist/*COMPLETE-UPLOAD.zip")[0]);
          $need = ["index.php","includes/bootstrap.php","vendor/autoload.php","themes/base/theme.json","cron.php","install.php"];
          $names = [];
          for ($i=0;$i<$z->numFiles;$i++) $names[] = $z->getNameIndex($i);
          foreach ($need as $n) {
              if (!in_array($n,$names,true)) { fwrite(STDERR,"missing $n\n"); exit(1); }
          }
          foreach ($names as $n) {
              if (str_starts_with($n,"config/config.php")||str_contains($n,"/phpunit/")||str_starts_with($n,"tests/")) {
                  fwrite(STDERR,"forbidden member $n\n"); exit(1);
              }
          }
          $z->close();
          // UPDATE.zip must pass our own CoreUpdater inspection + manifest hashes.
          $u = new Core\Update\CoreUpdater(WC_ROOT, sys_get_temp_dir(), new Core\Modules\ArchiveInspector());
          [$info,$err] = $u->inspect(glob("/tmp/dist/*-UPDATE.zip")[0]);
          if ($err !== null) { fwrite(STDERR,"update inspect: $err\n"); exit(1); }
          // Every reference package zip must pass the archive inspector.
          foreach (glob("/tmp/dist/Website-Core-Package-*.zip") as $pkg) {
              $errs = (new Core\Modules\ArchiveInspector())->inspect($pkg);
              if ($errs !== []) { fwrite(STDERR,basename($pkg).": ".implode(";",$errs)."\n"); exit(1); }
          }
          // FULL-PROJECT must contain docs+tests+sdk+examples, no .git.
          $z->open(glob("/tmp/dist/*FULL-PROJECT.zip")[0]);
          $has = ["Website-Core/docs/","Website-Core/tests/","Website-Core/sdk/","Website-Core/examples/"];
          $found = array_fill_keys($has,false);
          for ($i=0;$i<$z->numFiles;$i++) {
              $n = $z->getNameIndex($i);
              if (str_contains($n,"/.git/")) { fwrite(STDERR,"git member $n\n"); exit(1); }
              foreach ($has as $h) if (str_starts_with($n,$h)) $found[$h]=true;
          }
          foreach ($found as $h=>$ok) if (!$ok) { fwrite(STDERR,"FULL-PROJECT missing $h\n"); exit(1); }
          echo "artifact contract OK\n";'
