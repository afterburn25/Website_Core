name: Temporary pinned Catering 2.1 snapshot promotion

# Branch-only one-time source sync. This workflow must NOT be merged into main.
# Its only write is to the dedicated review branch, never production/main.
on:
  push:
    branches:
      - chatgpt/catering-21-snapshot-promotion-20261103

permissions:
  contents: write

jobs:
  sync:
    name: Copy reviewed authoritative module snapshot to review branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out dedicated Core review branch
        uses: actions/checkout@v4
        with:
          path: core
          fetch-depth: 0
      - name: Check out pinned authoritative module commit
        uses: actions/checkout@v4
        with:
          repository: afterburn25/Core_Mods
          ref: ecdf34b8a471f5db113a1cadc84c78fc688e735a
          path: modules-source
          persist-credentials: false
      - name: Verify module and synchronize source (never nested ZIP)
        run: |
          set -euo pipefail
          test "$(git -C modules-source rev-parse HEAD)" = "ecdf34b8a471f5db113a1cadc84c78fc688e735a"
          git -C core merge-base --is-ancestor c5d7e379e74fd584afc55e755be4da561116f7c6 HEAD
          php -r '
            $m=json_decode(file_get_contents("modules-source/modules/industry-catering/addon.json"),true);
            if (($m["id"]??null)!=="cajunwebpro/catering"
                || ($m["version"]??null)!=="2.1.0"
                || ($m["requires"]["core"]??null)!==">=2.6.2,<3.0.0") {
              fwrite(STDERR,"Unexpected module version/contract\n");exit(1);
            }'
          rm -rf core/examples/industry-catering
          mkdir -p core/examples/industry-catering
          cp -a modules-source/modules/industry-catering/. core/examples/industry-catering/
          # The standalone module repository publishes a separate release ZIP.
          # Include actual source/assets/tests/docs, never that ZIP inside Core.
          rm -rf core/examples/industry-catering/releases
          test -z "$(find core/examples/industry-catering -type f -iname '*.zip' -print -quit)"
          test -f core/examples/industry-catering/assets/images/catering-co-logo.png
          test -f core/examples/industry-catering/migrations/0008_event_workspace.php
          git -C core add -A examples/industry-catering
          if git -C core diff --cached --quiet; then
            echo "Already synchronized; no additional commit"
            exit 0
          fi
          git -C core config user.name "github-actions[bot]"
          git -C core config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C core commit -m "Sync authoritative Catering 2.1.0 source snapshot (no nested archives)"
          git -C core push origin HEAD:refs/heads/chatgpt/catering-21-snapshot-promotion-20261103
